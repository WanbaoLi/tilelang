<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1200 720"><title id="title">SM100 block-scaled GEMM data path</title><desc id="desc">Global memory A, B, SFA, and SFB move through TMA, shared memory, scale-factor transpose, UTCCP copy, tensor memory MMA, and epilogue store.</desc><defs><linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fbfaf6"/><stop offset="58%" stop-color="#f6fbff"/><stop offset="100%" stop-color="#f7fff9"/></linearGradient><linearGradient id="headerGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#eef6ff"/><stop offset="100%" stop-color="#f2fff8"/></linearGradient><filter id="shadow" width="124%" height="140%" x="-12%" y="-18%"><feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity=".12" stdDeviation="7"/></filter><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#263238" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="blueArrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#1f6feb" d="M0,0 L8,3 L0,6 Z"/></marker></defs><style>.bg{fill:url(#bgGrad)}.halo{fill:url(#headerGrad);stroke:#d9e6f2;stroke-width:1;rx:18}.title{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#1f2933}.section{font:700 16px Arial,sans-serif;fill:#344054;letter-spacing:.3px}.label{font:700 15px Arial,sans-serif;fill:#1f2933}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:11px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.25;rx:10;filter:url(#shadow)}.gmem{fill:#e8f4ff;stroke:#6da9ff}.smem{fill:#fff5df;stroke:#d49a30}.tmem{fill:#e9f8ef;stroke:#4cae68}.bar{fill:#f8fafc;stroke:#94a3b8}.op{fill:#f4ecff;stroke:#a56ae8}.blue,.line{fill:none}.line{stroke:#334155;stroke-width:2.1;marker-end:url(#arrow)}.blue{stroke:#1f6feb;stroke-width:2.5;marker-end:url(#blueArrow)}.dash{stroke-dasharray:6 5}</style><rect width="1200" height="720" class="bg"/><rect width="720" height="64" x="28" y="20" class="halo"/><text x="48" y="48" class="title">Blackwell MXFP8 Block-Scaled GEMM Data Path</text><text x="50" y="70" class="small">A/B are FP8; SFA/SFB are packed UE8M0 scale factors; C accumulates in TMEM.</text><text x="50" y="118" class="section">GLOBAL MEMORY</text><rect width="150" height="72" x="40" y="132" class="box gmem"/><text x="68" y="163" class="label">A[M,K]</text><text x="62" y="184" class="tiny">FP8 tile M x K</text><rect width="150" height="72" x="210" y="132" class="box gmem"/><text x="238" y="163" class="label">B[K,N]</text><text x="228" y="184" class="tiny">FP8 tile K x N</text><rect width="190" height="72" x="380" y="132" class="box gmem"/><text x="412" y="163" class="label">SFA / SFB</text><text x="404" y="184" class="tiny">4 UE8M0 bytes per u32</text><rect width="150" height="72" x="1010" y="132" class="box gmem"/><text x="1058" y="163" class="label">C</text><text x="1034" y="184" class="tiny">BF16 output</text><text x="50" y="270" class="section">SHARED MEMORY PIPELINE STAGE</text><rect width="210" height="94" x="40" y="286" class="box smem"/><text x="78" y="318" class="label">A_shared[s]</text><text x="68" y="342" class="tiny">block_M x block_K</text><text x="68" y="362" class="tiny">loaded by TMA</text><rect width="210" height="94" x="270" y="286" class="box smem"/><text x="308" y="318" class="label">B_shared[s]</text><text x="294" y="342" class="tiny">block_K x block_N</text><text x="294" y="362" class="tiny">half_N per CTA in 2CTA</text><rect width="220" height="94" x="500" y="286" class="box smem"/><text x="528" y="318" class="label">SFA/SFB_shared[s]</text><text x="532" y="342" class="tiny">u32 vectors from TMA</text><text x="532" y="362" class="tiny">load every 4 K stages</text><rect width="190" height="94" x="760" y="286" class="box op"/><text x="796" y="318" class="label">SF transpose</text><text x="788" y="342" class="tiny">4 x 32 -&gt; 32 x 4</text><text x="788" y="362" class="tiny">then fence.proxy.async</text><text x="50" y="500" class="section">TENSOR MEMORY AND MMA</text><rect width="200" height="96" x="520" y="456" class="box tmem"/><text x="558" y="488" class="label">SFA_tmem</text><text x="550" y="512" class="tiny">128 lanes x 4 cols</text><text x="550" y="532" class="tiny">id = k mod 4</text><rect width="200" height="96" x="740" y="456" class="box tmem"/><text x="778" y="488" class="label">SFB_tmem</text><text x="770" y="512" class="tiny">128 lanes x 4/8 cols</text><text x="770" y="532" class="tiny">N chunks of 128 cols</text><rect width="250" height="88" x="410" y="580" class="box op"/><text x="438" y="612" class="label">tcgen05.mma.block_scale</text><text x="444" y="636" class="tiny">(A * scale_A) * (B * scale_B)</text><text x="444" y="654" class="tiny">cta_group::1 or cta_group::2</text><rect width="210" height="88" x="690" y="580" class="box tmem"/><text x="746" y="612" class="label">C_tmem</text><text x="724" y="636" class="tiny">FP32 accumulator</text><text x="724" y="654" class="tiny">block_M x block_N</text><rect width="180" height="88" x="930" y="580" class="box smem"/><text x="984" y="612" class="label">Epilogue</text><text x="962" y="636" class="tiny">TMEM -&gt; regs</text><text x="962" y="654" class="tiny">regs -&gt; SMEM -&gt; C</text><path d="M115 204 C115 235, 145 252, 145 286" class="blue"/><path d="M285 204 C285 235, 335 252, 375 286" class="blue"/><path d="M475 204 C475 235, 610 246, 610 286" class="blue"/><text x="78" y="244" class="tiny">TMA every K stage</text><text x="404" y="244" class="tiny">SF TMA every 4 K stages</text><path d="M720 333 L760 333" class="line"/><path d="M850 380 C850 420, 710 420, 620 456" class="line"/><path d="M855 380 C855 420, 805 420, 840 456" class="line"/><text x="860" y="400" class="tiny">tcgen05.cp.32x128b.warpx4</text><path d="M250 356 C310 430, 410 536, 490 580" class="line"/><path d="M480 356 C500 440, 505 515, 520 580" class="line"/><path d="M620 552 C600 568, 565 568, 535 580" class="line dash"/><path d="M840 552 C790 570, 705 570, 632 592" class="line dash"/><path d="M660 624 L690 624" class="line"/><path d="M900 624 L930 624" class="line"/><path d="M1110 624 C1160 540, 1120 300, 1085 204" class="line"/><rect width="410" height="56" x="48" y="418" class="box bar"/><text x="66" y="450" class="label">Barrier ring:</text><text x="170" y="450" class="small">consumed -&gt; loaded -&gt; with_sf_full -&gt; consumed</text><rect width="330" height="56" x="786" y="418" class="box bar"/><text x="806" y="450" class="label">Final handoff:</text><text x="920" y="442" class="small">tmem_full</text><text x="920" y="460" class="small">persistent path also uses tmem_empty</text></svg>