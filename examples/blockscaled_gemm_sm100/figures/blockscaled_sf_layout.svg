<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" aria-labelledby="title desc" role="img" viewBox="0 0 1200 760"><title id="title">Scale-factor packing, SMEM transpose, and TMEM layout</title><desc id="desc">UE8M0 scale factors are packed four per uint32, loaded to shared memory, transposed in 128-word chunks, copied to tensor memory columns, and selected by sf_id.</desc><defs><linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fbfaf6"/><stop offset="58%" stop-color="#f7fbff"/><stop offset="100%" stop-color="#f8fff8"/></linearGradient><linearGradient id="panelGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient><filter id="shadow" width="120%" height="124%" x="-10%" y="-8%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="9"/></filter><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#263238" d="M0,0 L8,3 L0,6 Z"/></marker></defs><style>.bg{fill:url(#bgGrad)}.title{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#1f2933}.head{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#111827}.label{font:700 13px Arial,sans-serif;fill:#1f2933}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:10.5px Arial,sans-serif;fill:#475569}.panel{fill:url(#panelGrad);stroke:#d0d7de;stroke-width:1.25;rx:14;filter:url(#shadow)}.gmem{fill:#e8f4ff;stroke:#6da9ff}.smem{fill:#fff5df;stroke:#d49a30}.tmem{fill:#e9f8ef;stroke:#4cae68}.byte0{fill:#dbeafe;stroke:#2563eb}.byte1{fill:#dcfce7;stroke:#16a34a}.byte2{fill:#fef3c7;stroke:#b45309}.byte3{fill:#fce7f3;stroke:#db2777}.word{fill:#f8fafc;stroke:#64748b}.line{stroke:#263238;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}</style><rect width="1200" height="760" class="bg"/><text x="46" y="46" class="title">Scale-Factor Layout: Global -&gt; SMEM -&gt; TMEM</text><text x="48" y="72" class="small">Example uses block_K = sf_granularity_k = 128, so one packed word covers four K iterations.</text><rect width="330" height="560" x="40" y="110" class="panel"/><text x="70" y="145" class="head">1. Global packed SF</text><text x="70" y="172" class="small">group-major flat layout</text><rect width="248" height="64" x="72" y="205" class="gmem"/><text x="94" y="230" class="label">SFA[sf_group * M + row]</text><text x="94" y="252" class="tiny">same pattern for SFB with N</text><text x="72" y="306" class="small">One uint32 word:</text><g transform="translate(72,322)"><rect width="58" height="42" x="0" y="0" class="byte0"/><rect width="58" height="42" x="58" y="0" class="byte1"/><rect width="58" height="42" x="116" y="0" class="byte2"/><rect width="58" height="42" x="174" y="0" class="byte3"/><text x="16" y="26" class="label">sf0</text><text x="74" y="26" class="label">sf1</text><text x="132" y="26" class="label">sf2</text><text x="190" y="26" class="label">sf3</text><text x="0" y="60" class="tiny">bits 0..7</text><text x="56" y="60" class="tiny">8..15</text><text x="112" y="60" class="tiny">16..23</text><text x="172" y="60" class="tiny">24..31</text></g><rect width="248" height="102" x="72" y="442" class="word"/><text x="92" y="470" class="label">K stage mapping</text><text x="92" y="494" class="tiny">k % 4 = 0 -&gt; sf0</text><text x="92" y="514" class="tiny">k % 4 = 1 -&gt; sf1</text><text x="92" y="534" class="tiny">k % 4 = 2 -&gt; sf2</text><text x="92" y="554" class="tiny">k % 4 = 3 -&gt; sf3</text><text x="72" y="610" class="tiny">The unpacked scale is 2^(ue8m0 - 127).</text><rect width="330" height="560" x="430" y="110" class="panel"/><text x="460" y="145" class="head">2. SMEM transpose for UTCCP</text><text x="460" y="172" class="small">per 128-word chunk</text><text x="460" y="218" class="label">Before: 4 x 32 view</text><g transform="translate(460,235)"><rect width="232" height="104" x="0" y="0" class="smem"/><line x1="0" x2="232" y1="26" y2="26" stroke="#b7791f"/><line x1="0" x2="232" y1="52" y2="52" stroke="#b7791f"/><line x1="0" x2="232" y1="78" y2="78" stroke="#b7791f"/><line x1="58" x2="58" y1="0" y2="104" stroke="#b7791f"/><line x1="116" x2="116" y1="0" y2="104" stroke="#b7791f"/><line x1="174" x2="174" y1="0" y2="104" stroke="#b7791f"/><text x="8" y="17" class="tiny">word[0..31]</text><text x="66" y="17" class="tiny">...</text><text x="124" y="17" class="tiny">lane</text><text x="182" y="17" class="tiny">31</text><text x="8" y="43" class="tiny">word[32..63]</text><text x="8" y="69" class="tiny">word[64..95]</text><text x="8" y="95" class="tiny">word[96..127]</text></g><path d="M578 360 C578 386, 578 398, 578 424" class="line"/><text x="604" y="393" class="tiny">tcgen05_sf_warp_transpose</text><text x="460" y="456" class="label">After: 32 x 4 view</text><g transform="translate(460,473)"><rect width="232" height="104" x="0" y="0" class="smem"/><line x1="58" x2="58" y1="0" y2="104" stroke="#b7791f"/><line x1="116" x2="116" y1="0" y2="104" stroke="#b7791f"/><line x1="174" x2="174" y1="0" y2="104" stroke="#b7791f"/><line x1="0" x2="232" y1="26" y2="26" stroke="#b7791f"/><line x1="0" x2="232" y1="52" y2="52" stroke="#b7791f"/><line x1="0" x2="232" y1="78" y2="78" stroke="#b7791f"/><text x="18" y="17" class="tiny">lane 0</text><text x="78" y="17" class="tiny">sf0</text><text x="136" y="17" class="tiny">sf1</text><text x="192" y="17" class="tiny">sf2</text><text x="18" y="43" class="tiny">lane 1</text><text x="18" y="69" class="tiny">...</text><text x="18" y="95" class="tiny">lane 31</text></g><text x="460" y="612" class="tiny">TileLang applies this to each 128-word</text><text x="460" y="630" class="tiny">chunk automatically.</text><rect width="330" height="560" x="820" y="110" class="panel"/><text x="850" y="145" class="head">3. TMEM SF columns</text><text x="850" y="172" class="small">tcgen05.cp.32x128b.warpx4</text><g transform="translate(852,215)"><rect width="248" height="190" x="0" y="0" class="tmem"/><text x="70" y="28" class="label">SFA_tmem</text><text x="74" y="48" class="tiny">128 lanes x 4 columns</text><line x1="0" x2="248" y1="70" y2="70" stroke="#238636"/><line x1="0" x2="248" y1="110" y2="110" stroke="#238636"/><line x1="0" x2="248" y1="150" y2="150" stroke="#238636"/><line x1="62" x2="62" y1="70" y2="190" stroke="#238636"/><line x1="124" x2="124" y1="70" y2="190" stroke="#238636"/><line x1="186" x2="186" y1="70" y2="190" stroke="#238636"/><text x="12" y="96" class="tiny">lane 0</text><text x="78" y="96" class="tiny">col1</text><text x="140" y="96" class="tiny">col2</text><text x="202" y="96" class="tiny">col3</text><text x="12" y="136" class="tiny">...</text><text x="12" y="176" class="tiny">lane 127</text></g><g transform="translate(852,450)"><rect width="248" height="124" x="0" y="0" class="tmem"/><text x="72" y="28" class="label">SFB_tmem</text><text x="48" y="48" class="tiny">128 lanes x 8 columns for block_N=256</text><rect width="45" height="34" x="20" y="70" class="byte0"/><rect width="45" height="34" x="65" y="70" class="byte1"/><rect width="45" height="34" x="110" y="70" class="byte2"/><rect width="45" height="34" x="155" y="70" class="byte3"/><text x="31" y="91" class="tiny">id0</text><text x="76" y="91" class="tiny">id1</text><text x="121" y="91" class="tiny">id2</text><text x="166" y="91" class="tiny">id3</text><text x="22" y="116" class="tiny">u32 cell byte sub-columns</text></g><path d="M370 390 C410 390, 410 390, 430 390" class="line"/><path d="M760 390 C800 390, 800 310, 852 310" class="line"/><text x="806" y="328" class="tiny">4 TMEM columns per</text><text x="806" y="344" class="tiny">128-word chunk</text><path d="M976 574 C976 620, 910 632, 840 632" class="line dash"/><text x="842" y="654" class="tiny">sf_id selects the byte sub-column for this K iteration.</text></svg>