<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" aria-labelledby="title desc" role="img" viewBox="0 0 1200 670"><title id="title">Warp-specialized pipeline and barriers</title><desc id="desc">Timeline for TMA, scale-factor transpose, UTCCP, MMA, and epilogue roles.</desc><defs><linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fbfaf6"/><stop offset="58%" stop-color="#f7fbff"/><stop offset="100%" stop-color="#f8fff8"/></linearGradient><filter id="shadow" width="116%" height="142%" x="-8%" y="-18%"><feDropShadow dx="0" dy="5" flood-color="#0f172a" flood-opacity=".11" stdDeviation="6"/></filter><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#263238" d="M0,0 L8,3 L0,6 Z"/></marker></defs><style>.bg{fill:url(#bgGrad)}.label,.title{fill:#1f2933}.title{font:700 27px Inter,Segoe UI,Arial,sans-serif}.label{font:700 14px Arial,sans-serif}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:11px Arial,sans-serif;fill:#475569}.lane{fill:#fff;stroke:#d0d7de;stroke-width:1;rx:12;filter:url(#shadow)}.tma{fill:#e8f4ff;stroke:#6da9ff}.sf{fill:#fff5df;stroke:#d49a30}.mma{fill:#f4ecff;stroke:#a56ae8}.store{fill:#e9f8ef;stroke:#4cae68}.bar{fill:#f8fafc;stroke:#94a3b8}.line{stroke:#263238;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:5 5}</style><rect width="1200" height="670" class="bg"/><text x="46" y="46" class="title">Warp-Specialized Handshake</text><text x="48" y="72" class="small">The roles are fixed by warp index. Barrier parity advances with pipeline stage and persistent wave.</text><text x="72" y="124" class="label">Role</text><text x="240" y="124" class="label">1. wait / produce</text><text x="452" y="124" class="label">2. transform</text><text x="664" y="124" class="label">3. issue MMA</text><text x="892" y="124" class="label">4. epilogue</text><rect width="1080" height="88" x="50" y="145" class="lane"/><text x="72" y="182" class="label">warp 0</text><text x="72" y="204" class="tiny">TMA producer</text><rect width="142" height="46" x="200" y="166" class="bar"/><text x="224" y="194" class="small">wait consumed</text><rect width="172" height="46" x="372" y="166" class="tma"/><text x="392" y="187" class="small">TMA A/B</text><text x="392" y="205" class="tiny">plus SF every 4 K</text><rect width="128" height="46" x="580" y="166" class="bar"/><text x="608" y="194" class="small">arrive loaded</text><rect width="1080" height="88" x="50" y="255" class="lane"/><text x="72" y="292" class="label">warp 2</text><text x="72" y="314" class="tiny">SF transposer</text><rect width="128" height="46" x="200" y="276" class="bar"/><text x="224" y="304" class="small">wait loaded</text><rect width="190" height="46" x="372" y="276" class="sf"/><text x="390" y="297" class="small">transpose 128 u32 chunks</text><text x="390" y="315" class="tiny">4 x 32 -&gt; 32 x 4</text><rect width="144" height="46" x="590" y="276" class="sf"/><text x="616" y="297" class="small">proxy fence</text><text x="608" y="315" class="tiny">SMEM -&gt; async proxy</text><rect width="150" height="46" x="768" y="276" class="bar"/><text x="792" y="304" class="small">arrive with_sf_full</text><rect width="1080" height="96" x="50" y="365" class="lane"/><text x="72" y="404" class="label">warp 1</text><text x="72" y="426" class="tiny">leader CTA MMA</text><rect width="160" height="46" x="200" y="386" class="bar"/><text x="226" y="414" class="small">wait with_sf_full</text><rect width="172" height="46" x="392" y="386" class="mma"/><text x="412" y="407" class="small">tcgen05.cp.warpx4</text><text x="414" y="425" class="tiny">SMEM SF -&gt; TMEM SF</text><rect width="180" height="46" x="596" y="386" class="mma"/><text x="616" y="407" class="small">tcgen05.mma.block_scale</text><text x="616" y="425" class="tiny">clear_accum only on k=0</text><rect width="130" height="46" x="806" y="386" class="bar"/><text x="830" y="414" class="small">arrive consumed</text><rect width="128" height="46" x="966" y="386" class="bar"/><text x="988" y="414" class="small">arrive tmem_full</text><rect width="1080" height="96" x="50" y="485" class="lane"/><text x="72" y="524" class="label">epilogue</text><text x="72" y="546" class="tiny">all warps or 4..7</text><rect width="128" height="46" x="200" y="506" class="bar"/><text x="224" y="534" class="small">wait tmem_full</text><rect width="170" height="46" x="372" y="506" class="store"/><text x="396" y="527" class="small">C_tmem -&gt; regs</text><text x="396" y="545" class="tiny">then SMEM/global</text><rect width="150" height="46" x="584" y="506" class="bar"/><text x="606" y="527" class="small">persistent only</text><text x="610" y="545" class="tiny">arrive tmem_empty</text><path d="M708 189 C740 210, 184 240, 200 299" class="line dash"/><path d="M918 299 C950 324, 172 348, 200 409" class="line dash"/><path d="M936 409 C970 442, 172 468, 200 529" class="line dash"/><path d="M584 529 C538 600, 170 600, 200 189" class="line dash"/><rect width="338" height="52" x="792" y="592" class="bar"/><text x="816" y="616" class="small">2CTA uses cluster barriers for with_sf_full,</text><text x="816" y="634" class="small">consumed, and tmem_empty.</text></svg>