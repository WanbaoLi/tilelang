<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" aria-labelledby="title desc" role="img" viewBox="0 0 1200 650"><title id="title">Block-scaled GEMM kernel variants</title><desc id="desc">Comparison of 1CTA, 2CTA, and persistent 2CTA scheduling designs.</desc><defs><linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fbfaf6"/><stop offset="55%" stop-color="#f7fbff"/><stop offset="100%" stop-color="#f8fff8"/></linearGradient><linearGradient id="cardGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient><filter id="shadow" width="120%" height="126%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#0f172a" flood-opacity=".12" stdDeviation="9"/></filter><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#263238" d="M0,0 L8,3 L0,6 Z"/></marker></defs><style>.bg{fill:url(#bgGrad)}.title{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#1f2933}.head{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#111827}.label{font:700 14px Arial,sans-serif;fill:#1f2933}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:11px Arial,sans-serif;fill:#475569}.card{fill:url(#cardGrad);stroke:#d0d7de;stroke-width:1.25;rx:14;filter:url(#shadow)}.cta0{fill:#e8f4ff;stroke:#6da9ff}.cta1{fill:#fff5df;stroke:#d49a30}.tile{fill:#e9f8ef;stroke:#4cae68}.tmem{fill:#f4ecff;stroke:#a56ae8}.ep{fill:#ffe9e4;stroke:#e28a60}.line{stroke:#263238;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style><rect width="1200" height="650" class="bg"/><text x="46" y="46" class="title">Three Versions in GEMM Example</text><text x="48" y="72" class="small">All versions run the same block-scaled MMA data path; they differ in CTA grouping and scheduling.</text><rect width="340" height="500" x="40" y="105" class="card"/><text x="70" y="140" class="head">1CTA</text><text x="70" y="164" class="small">mxfp8_blockscaled_gemm</text><rect width="250" height="120" x="82" y="200" class="tile"/><text x="160" y="230" class="label">one CTA tile</text><text x="170" y="254" class="small">128 x 128</text><text x="116" y="282" class="tiny">local SMEM, local TMEM, local barriers</text><rect width="260" height="44" x="78" y="360" class="cta0"/><text x="96" y="388" class="label">warp 0: TMA producer</text><rect width="260" height="44" x="78" y="414" class="tmem"/><text x="96" y="442" class="label">warp 1: UTCCP + MMA issue</text><rect width="260" height="44" x="78" y="468" class="cta1"/><text x="96" y="496" class="label">warp 2: SF transpose</text><text x="78" y="542" class="tiny">Epilogue waits tmem_full.</text><text x="78" y="562" class="tiny">Then C_tmem is copied through regs/SMEM to C.</text><rect width="340" height="500" x="430" y="105" class="card"/><text x="460" y="140" class="head">2CTA</text><text x="460" y="164" class="small">mxfp8_blockscaled_gemm_2cta</text><rect width="260" height="120" x="468" y="200" class="tile"/><line x1="598" x2="598" y1="200" y2="320" stroke="#238636" stroke-width="2"/><text x="565" y="230" class="label">logical tile</text><text x="565" y="254" class="small">128 x 256</text><text x="535" y="282" class="tiny">CTA pair computes one tile</text><rect width="120" height="70" x="466" y="354" class="cta0"/><text x="490" y="382" class="label">CTA 0</text><text x="488" y="404" class="tiny">B columns 0..127</text><rect width="120" height="70" x="612" y="354" class="cta1"/><text x="636" y="382" class="label">CTA 1</text><text x="634" y="404" class="tiny">B columns 128..255</text><path d="M586 390 L612 390" class="line dash"/><rect width="246" height="58" x="474" y="454" class="tmem"/><text x="505" y="484" class="label">leader CTA issues cta_group::2</text><text x="512" y="504" class="tiny">cluster barriers cover both CTAs</text><text x="466" y="542" class="tiny">A and SFA are available in both peers.</text><text x="466" y="562" class="tiny">SFB covers the full logical block_N.</text><rect width="340" height="500" x="820" y="105" class="card"/><text x="850" y="140" class="head">2CTA Persistent</text><text x="850" y="164" class="small">mxfp8_blockscaled_gemm_2cta_persistent</text><rect width="230" height="52" x="864" y="200" class="cta0"/><text x="890" y="232" class="label">resident CTA pair per cluster</text><path d="M980 252 C980 280, 980 292, 980 318" class="line"/><rect width="240" height="92" x="860" y="318" class="tile"/><text x="900" y="348" class="label">wave loop over tiles</text><text x="890" y="374" class="tiny">tile_id = num_clusters * w + cluster_id</text><rect width="118" height="68" x="854" y="438" class="tmem"/><text x="878" y="466" class="label">MMA</text><text x="876" y="488" class="tiny">warps 0..2</text><rect width="118" height="68" x="986" y="438" class="ep"/><text x="1012" y="466" class="label">Store</text><text x="1004" y="488" class="tiny">warps 4..7</text><path d="M972 472 L986 472" class="line"/><path d="M1045 506 C1045 534, 900 534, 900 506" class="line dash"/><text x="914" y="542" class="tiny">tmem_full sends data to epilogue.</text><text x="914" y="562" class="tiny">tmem_empty releases TMEM for the next wave.</text></svg>